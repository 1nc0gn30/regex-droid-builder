[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regex-droid-builder"
version = "0.1.0"
description = "Visual Regex AST Builder, ReDoS Catastrophic Backtracking Detector & Multi-Language Code Generator"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "1nc0gn30" }
]
keywords = [
    "regex",
    "ast",
    "redos",
    "security",
    "vulnerability-scanner",
    "mcp",
    "fastmcp",
    "material-3",
    "codegen",
    "zero-dependencies"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Security"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
regex-droid = "regex_droid_builder.cli:main"
regexdroid = "regex_droid_builder.cli:main"

[project.urls]
Homepage = "https://github.com/1nc0gn30/regex-droid-builder"
Repository = "https://github.com/1nc0gn30/regex-droid-builder"
Issues = "https://github.com/1nc0gn30/regex-droid-builder/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
