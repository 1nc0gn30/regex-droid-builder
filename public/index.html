<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Regex Studio | Visual AST Builder & ReDoS Vulnerability Detector</title>
  <style>
    :root {
      --g-blue: #1a73e8;
      --g-blue-dark: #1557b0;
      --g-blue-light: #e8f0fe;
      --g-green: #1e8e3e;
      --g-green-light: #e6f4ea;
      --g-yellow: #f9ab00;
      --g-yellow-light: #fef7e0;
      --g-red: #d93025;
      --g-red-light: #fce8e6;
      --surface: #ffffff;
      --surface-variant: #f8f9fa;
      --border: #dadce0;
      --border-subtle: #e8eaed;
      --text: #202124;
      --text-secondary: #5f6368;
      --code-bg: #f1f3f4;
      --shadow-sm: 0 1px 2px rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
      --shadow-md: 0 4px 8px 3px rgba(60,64,67,0.15);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-full: 9999px;
    }
    [data-theme="dark"] {
      --surface: #1e1f20;
      --surface-variant: #131314;
      --border: #3c4043;
      --border-subtle: #2d3134;
      --text: #e3e3e3;
      --text-secondary: #9aa0a6;
      --g-blue-light: #1c3b5e;
      --g-green-light: #133820;
      --g-red-light: #3c1e1e;
      --code-bg: #282a2c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Google Sans", "Segoe UI", Roboto, sans-serif;
      background: var(--surface-variant);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.15rem;
      font-weight: 600;
    }
    .brand-icon {
      background: var(--g-blue);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .badge {
      background: var(--g-blue-light);
      color: var(--g-blue);
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 500;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .btn-icon {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.75rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .container {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      overflow: hidden;
    }
    aside {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 1.25rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .section-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .preset-item {
      padding: 0.6rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: var(--surface-variant);
      cursor: pointer;
      transition: all 0.15s;
    }
    .preset-item:hover {
      border-color: var(--g-blue);
      background: var(--g-blue-light);
    }
    .preset-item.active {
      background: var(--g-blue-light);
      border-color: var(--g-blue);
    }
    .preset-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }
    .preset-cat {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    main {
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .pattern-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.4rem 0.75rem;
      font-family: monospace;
      font-size: 1rem;
    }
    .pattern-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: inherit;
    }
    .flags-box {
      display: flex;
      gap: 0.35rem;
    }
    .flag-chip {
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      cursor: pointer;
      user-select: none;
    }
    .flag-chip.active {
      background: var(--g-blue);
      color: white;
      border-color: var(--g-blue);
    }
    .redos-banner {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      margin-top: 0.75rem;
    }
    .redos-banner.SAFE { background: var(--g-green-light); color: var(--g-green); border: 1px solid var(--g-green); }
    .redos-banner.CRITICAL_REDOS, .redos-banner.HIGH { background: var(--g-red-light); color: var(--g-red); border: 1px solid var(--g-red); }
    .redos-banner.MEDIUM, .redos-banner.LOW { background: var(--g-yellow-light); color: #b06000; border: 1px solid var(--g-yellow); }
    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    .tab {
      padding: 0.5rem 1rem;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      border-bottom: 2px solid transparent;
    }
    .tab.active {
      color: var(--g-blue);
      border-bottom-color: var(--g-blue);
      font-weight: 600;
    }
    .explanation-steps {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.5rem 0.75rem;
      border-radius: var(--radius-sm);
      background: var(--surface-variant);
      font-size: 0.85rem;
    }
    .step-badge {
      background: var(--g-blue-light);
      color: var(--g-blue);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      white-space: nowrap;
    }
    .test-area {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
    }
    .test-results-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .test-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .test-row.match { background: var(--g-green-light); color: var(--g-green); }
    .test-row.fail { background: var(--g-red-light); color: var(--g-red); }
    pre {
      background: var(--code-bg);
      padding: 1rem;
      border-radius: var(--radius-sm);
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.85rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-icon">🤖</div>
      <span>Google Regex Studio</span>
      <span class="badge">AST & ReDoS Defense</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="toggleTheme()">🌓 Theme</button>
      <button class="btn-icon" onclick="copyCode()">📋 Copy Snippet</button>
    </div>
  </header>

  <div class="container">
    <aside>
      <div class="section-title">Curated Presets</div>
      <div class="preset-list" id="preset-list"></div>
    </aside>

    <main>
      <!-- Pattern Input Card -->
      <div class="card">
        <div class="section-title">Regular Expression</div>
        <div class="pattern-bar">
          <span style="color:var(--text-secondary);">/</span>
          <input type="text" id="pattern-input" class="pattern-input" value="^[\w.+-]+@[\w-]+\.[a-zA-Z]{2,}$" oninput="handlePatternChange()">
          <span style="color:var(--text-secondary);">/</span>
          <div class="flags-box">
            <span class="flag-chip" id="flag-i" onclick="toggleFlag('i')">i</span>
            <span class="flag-chip" id="flag-m" onclick="toggleFlag('m')">m</span>
            <span class="flag-chip" id="flag-s" onclick="toggleFlag('s')">s</span>
          </div>
        </div>

        <div id="redos-container"></div>
      </div>

      <!-- Analysis Tabs -->
      <div class="card">
        <div class="tabs">
          <div class="tab active" onclick="switchTab('explain')">AST Breakdown</div>
          <div class="tab" onclick="switchTab('test')">Test Matrix</div>
          <div class="tab" onclick="switchTab('codegen')">Code Generator</div>
        </div>

        <!-- Tab 1: AST Explanation -->
        <div id="tab-explain">
          <div class="explanation-steps" id="explanation-steps"></div>
        </div>

        <!-- Tab 2: Test Matrix -->
        <div id="tab-test" style="display:none;">
          <div class="test-area">
            <label style="font-size:0.85rem; color:var(--text-secondary);">Test Strings (one per line):</label>
            <textarea id="test-strings-input" rows="4" oninput="runTests()">alex.dev+test@example.com
invalid.email@com
user@domain.co.uk
plainstring</textarea>
            <div class="test-results-list" id="test-results-list"></div>
          </div>
        </div>

        <!-- Tab 3: Code Generator -->
        <div id="tab-codegen" style="display:none;">
          <div style="display:flex; gap:0.5rem; margin-bottom:0.75rem;">
            <button class="btn-icon" onclick="showLang('python')">Python</button>
            <button class="btn-icon" onclick="showLang('javascript')">JavaScript</button>
            <button class="btn-icon" onclick="showLang('rust')">Rust</button>
            <button class="btn-icon" onclick="showLang('go')">Go</button>
          </div>
          <pre id="code-snippet-box"></pre>
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentFlags = '';
    let currentSnippets = {};
    let activeLang = 'python';

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    function toggleFlag(flag) {
      if (currentFlags.includes(flag)) {
        currentFlags = currentFlags.replace(flag, '');
        document.getElementById('flag-' + flag).classList.remove('active');
      } else {
        currentFlags += flag;
        document.getElementById('flag-' + flag).classList.add('active');
      }
      handlePatternChange();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('tab-explain').style.display = tabId === 'explain' ? 'block' : 'none';
      document.getElementById('tab-test').style.display = tabId === 'test' ? 'block' : 'none';
      document.getElementById('tab-codegen').style.display = tabId === 'codegen' ? 'block' : 'none';
    }

    async function loadPresets() {
      const resp = await fetch('/api/presets');
      const data = await resp.json();
      const list = document.getElementById('preset-list');
      list.innerHTML = data.presets.map((p, idx) => `
        <div class="preset-item ${idx === 0 ? 'active' : ''}" onclick="selectPreset('${p.id}')">
          <div class="preset-name">${p.name}</div>
          <div class="preset-cat">${p.category}</div>
        </div>
      `).join('');
    }

    async function selectPreset(id) {
      const resp = await fetch('/api/presets');
      const data = await resp.json();
      const p = data.presets.find(x => x.id === id);
      if (p) {
        document.getElementById('pattern-input').value = p.pattern;
        document.querySelectorAll('.preset-item').forEach(i => i.classList.remove('active'));
        event.currentTarget.classList.add('active');
        if (p.test_cases && p.test_cases.length) {
          document.getElementById('test-strings-input').value = p.test_cases.map(tc => tc.input).join('\n');
        }
        handlePatternChange();
      }
    }

    async function handlePatternChange() {
      const pattern = document.getElementById('pattern-input').value;

      // 1. ReDoS Audit
      try {
        const redosResp = await fetch('/api/redos', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({pattern, flags: currentFlags})
        });
        const redos = await redosResp.json();
        const banner = document.getElementById('redos-container');
        banner.innerHTML = `
          <div class="redos-banner ${redos.severity}">
            <div>
              <strong>${redos.severity === 'SAFE' ? '🛡️ Safe Regex' : '⚠️ ReDoS Warning (' + redos.severity + ')'}</strong> (${redos.complexity_order})
              <p style="font-size:0.85rem; margin-top:2px;">${redos.description}</p>
              ${redos.remediation && redos.is_vulnerable ? `<p style="font-size:0.8rem; margin-top:4px;"><em>Fix: ${redos.remediation}</em></p>` : ''}
            </div>
          </div>
        `;
      } catch (e) {}

      // 2. AST Explanation
      try {
        const expResp = await fetch('/api/explain', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({pattern, flags: currentFlags})
        });
        const exp = await expResp.json();
        const stepContainer = document.getElementById('explanation-steps');
        stepContainer.innerHTML = exp.explanation_steps.map((s, idx) => `
          <div class="step-item">
            <span class="step-badge">#${idx + 1} ${s.type}</span>
            <div>
              <code>${s.value || ''}</code>
              <span>${s.explanation}</span>
            </div>
          </div>
        `).join('');
      } catch (e) {}

      // 3. Code Generation
      try {
        const codeResp = await fetch('/api/codegen', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({pattern, flags: currentFlags})
        });
        const codeData = await codeResp.json();
        currentSnippets = codeData.snippets;
        showLang(activeLang);
      } catch (e) {}

      runTests();
    }

    async function runTests() {
      const pattern = document.getElementById('pattern-input').value;
      const lines = document.getElementById('test-strings-input').value.split('\n').filter(Boolean);

      try {
        const resp = await fetch('/api/test', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({pattern, flags: currentFlags, test_strings: lines})
        });
        const data = await resp.json();
        const list = document.getElementById('test-results-list');
        list.innerHTML = data.results.map(r => `
          <div class="test-row ${r.is_match ? 'match' : 'fail'}">
            <span>${r.is_match ? '✓' : '✗'} ${r.input}</span>
            <span>${r.is_match ? 'Matched' : 'No Match'}</span>
          </div>
        `).join('');
      } catch (e) {}
    }

    function showLang(lang) {
      activeLang = lang;
      if (currentSnippets[lang]) {
        document.getElementById('code-snippet-box').innerText = currentSnippets[lang];
      }
    }

    function copyCode() {
      const code = currentSnippets[activeLang] || '';
      navigator.clipboard.writeText(code);
      alert('Code snippet copied to clipboard!');
    }

    // Init
    loadPresets();
    handlePatternChange();
  </script>
</body>
</html>
